name: LazyChat
version: 1.1
main: lazy.dev.lazyChat.LazyChat
description: An example plugin
author: LazyBoat TEAM
website: https://github.com/lazyboatTEAM/
api-version: '1.21'
prefix: LazyBoat-LazyChat
permissions:
  l-chat.reload:
    description: Gives access to reload plugin
    default: op
  l-chat.info:
    description: Gives access to see some useful info about plugin
    default: not op
  l-chat.broadcast:
    description: Gives access to use /broadcast
    default: not op
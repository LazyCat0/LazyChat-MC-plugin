# Broadcast command
BC_usage: <gold>Використання - /bc <повідомлення>
BC_new_broadcast: <b><gold>Нове оголошення!</gold></b>
BC_broadcast_by: Оголошення від<gold>
# Mute command
Mute_usage: <gold>Використовування - /mute <ім'я гравця> <час для мута>
Mute_player_muted: отримав мут на
Mute_player_unmute: був розмучений
Mute_you_muted: <red>Вас щойно замутили на
Mute_you_just_muted: <red>Вас замутили!
Mute_you_unmuted: <green>Вас щойно розмутили!
Mute_set_time: Вам потрібно вказати час — «10h», «1m» і так далі. h — години, m — хвилини, d — дні.
Mute_unknown_time_format: Ви намагаєтеся використати невідомий формат часу. Вам потрібно використовувати наступний — «10m» — де m — хвилини, h — години, d — дні.

# Sign formatting command — sfc
SFC_usage: Використання - /pf <рядок таблички (від 1 до 4)> Текст, який також має підтримку MiniMessage!
SFC_success: Ви успішно змінили текст на табличці!
SFC_smth_went_wrong: Щось пішло не так. Можливо, варто подивитися на табличку або щось інше. Запитайте Адміністратора сервера.


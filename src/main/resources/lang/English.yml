# Mute command
Mute_usage: <gold>Usage - /lc-mute <mute/unmute> <player_name> <time_for_mute>(m/h/d)
Mute_player_muted: has got muted for
Mute_you_just_muted: <red>You muted for a
Mute_you_muted: <red>You muted!
Mute_player_unmute: has got unmuted
Mute_you_unmuted: <green>You just has got unmuted!
Mute_set_time: You must set time - "10h", "1m" and by this way. h - hours, m - minutes, d - days.
Mute_unknown_time_format: You trying to use unknown time format. You must use "10m" - where m - minutes.

